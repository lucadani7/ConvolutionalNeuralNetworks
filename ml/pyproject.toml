[project]
name = "cnn-digits"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lucadani7", email = "79052990+lucadani7@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "onnx>=1.23.2",
    "onnxruntime>=1.32.0",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[project.scripts]
cnn-digits = "cnn_digits:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
]
